[project]
name = "ocelescope-instance"
version = "0.1.0"
description = "An Ocelescope instance: the published backend host plus local modules"
requires-python = ">=3.11"
# `pnpm run add:backend` adds local backend modules here.
dependencies = [
  "ocelescope-backend>=0.10.1",
  "ocelescope-module-ocel>=0.10.1",
  "ocelescope-module-ocel-editor",
]

[tool.uv.workspace]
members = ["backend-modules/*"]

[tool.uv.sources]
ocelescope-module-ocel-editor = { workspace = true }

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "ruff>=0.17.1",
]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# pycodestyle, pyflakes, isort, pyupgrade, bugbear, simplify
select = ["E", "F", "I", "UP", "B", "SIM"]
# The formatter owns line length; long SQL lines in f-strings are fine
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI declares parameters through calls in their defaults
extend-immutable-calls = ["fastapi.Query", "fastapi.Depends", "fastapi.Body"]

[tool.pyright]
include = ["backend-modules"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.11"
typeCheckingMode = "standard"
